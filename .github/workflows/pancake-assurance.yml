name: Pancake assurance

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Assurance to run
        type: choice
        default: platform
        options:
          - release
          - platform
          - coverage
          - nightly
          - sanitizers
          - policy
          - all

  workflow_call:
    inputs:
      candidate_sha:
        description: Release candidate commit produced by the package workflow
        type: string
        required: true
      gate:
        description: Assurance to run
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pancake-assurance-${{ github.ref }}-${{ inputs.gate }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: pancake

jobs:
  platform:
    if: inputs.gate == 'platform' || inputs.gate == 'release' || inputs.gate == 'all'
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest@0.9.152,shellcheck@0.11.0
      - name: Provision Linux native build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-native-deps.sh
      - name: Install checksum-pinned actionlint release
        run: bash scripts/install-actionlint.sh "$RUNNER_TEMP/pancake-lint-tools"
      - run: bash scripts/check.sh fast
      - run: bash scripts/check.sh test-cpu
      - run: bash scripts/check.sh test-release

  windows-build:
    if: inputs.gate == 'platform' || inputs.gate == 'release' || inputs.gate == 'all'
    name: Windows MSVC build and link
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
      - name: Build and link every target without running Windows tests
        run: cargo test --locked --workspace --all-targets --all-features --target x86_64-pc-windows-msvc --no-run

  macos-native-build:
    if: inputs.gate == 'platform' || inputs.gate == 'release' || inputs.gate == 'all'
    name: macOS ARM64 native Metal build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
      - name: Build the locked native Apple executables
        run: |
          if [[ $(uname -m) != arm64 ]]; then
            printf 'Native Metal build requires a macOS ARM64 runner.\n' >&2
            exit 1
          fi
          cargo build --locked --release --workspace --bins --target aarch64-apple-darwin --features cubecl/metal-native

  coverage:
    if: inputs.gate == 'coverage' || inputs.gate == 'all'
    name: Coverage (${{ matrix.os }}, ${{ matrix.gate }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, gate: coverage-cpu}
          - {os: ubuntu-24.04, gate: branches-cpu}
          - {os: macos-15, gate: branches-cpu}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
      - name: Provision Linux native build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-native-deps.sh
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install nightly for branch coverage
        if: matrix.gate == 'branches-cpu'
        run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$PANCAKE_NIGHTLY" --profile minimal --component llvm-tools-preview
      - run: bash scripts/check.sh "${{ matrix.gate }}"
      - name: Retain available coverage diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pancake-${{ matrix.os }}-${{ matrix.gate }}
          if-no-files-found: ignore
          path: |
            pancake/target/assurance/coverage-cpu.json
            pancake/target/coverage/branches-cpu.json
            pancake/target/llvm-cov-target/pancake.profdata

  policy:
    if: inputs.gate == 'policy' || inputs.gate == 'release' || inputs.gate == 'all'
    name: Dependency and assurance policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-deny@0.20.2,cargo-mutants@27.1.0,cargo-machete@0.9.2
      - name: Install nightly for branch guardrail fixture
        run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$PANCAKE_NIGHTLY" --profile minimal --component llvm-tools-preview
      - run: bash scripts/check.sh deps
      - run: bash scripts/check.sh guardrails
        if: '!cancelled()'

  layouts:
    if: inputs.gate == 'nightly' || inputs.gate == 'release' || inputs.gate == 'all'
    name: Linux randomized layouts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
      - name: Provision Linux native build dependencies
        run: bash scripts/ci-linux-native-deps.sh
      - name: Install pinned nightly
        run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$PANCAKE_NIGHTLY" --profile minimal
      - run: bash scripts/check.sh layouts-cpu

  nightly:
    if: inputs.gate == 'nightly' || inputs.gate == 'release' || inputs.gate == 'all'
    name: macOS Miri and randomized layouts
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
      - name: Install pinned nightly
        run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$PANCAKE_NIGHTLY" --profile minimal --component miri --component rust-src
      - run: bash scripts/check.sh nightly-cpu

  sanitizer:
    if: inputs.gate == 'sanitizers' || inputs.gate == 'release' || inputs.gate == 'all'
    name: Sanitizer (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
      - name: Provision Linux native build dependencies
        run: bash scripts/ci-linux-native-deps.sh
      - name: Install pinned nightly
        run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$PANCAKE_NIGHTLY" --profile minimal --component rust-src
      - run: bash scripts/check.sh sanitizer "${{ matrix.kind }}"
