name: Pancake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pancake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: pancake

jobs:
  required:
    name: Pancake required
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: registry
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: pancake-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pancake/Cargo.lock') }}
          restore-keys: pancake-registry-${{ runner.os }}-${{ runner.arch }}-
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-nextest@0.9.152,shellcheck@0.11.0
      - name: Install checksum-pinned actionlint release
        run: bash scripts/install-actionlint.sh "$RUNNER_TEMP/pancake-lint-tools"
      - run: bash scripts/check.sh lint
      - run: bash scripts/check.sh test
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.registry.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ steps.registry.outputs.cache-primary-key }}
