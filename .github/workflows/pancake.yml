name: Pancake

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: read

concurrency:
  group: pancake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: pancake

jobs:
  platform:
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-nextest@0.9.152,cargo-hack@0.6.46,actionlint@1.7.12,shellcheck@0.11.0
      - run: bash scripts/check.sh fast
      - run: bash scripts/check.sh test

  assurance:
    name: Coverage, dependencies, mutation, and guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-deny@0.20.2,cargo-mutants@27.1.0,cargo-machete@0.9.2
      - name: Install nightly for branch guardrail fixture
        run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$PANCAKE_NIGHTLY" --profile minimal --component llvm-tools-preview
      - run: bash scripts/check.sh coverage
      - run: bash scripts/check.sh deps
      - run: bash scripts/check.sh mutants
      - run: bash scripts/check.sh guardrails

  nightly:
    name: Miri, randomized layouts, and branch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned nightly
        run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$PANCAKE_NIGHTLY" --profile minimal --component miri --component rust-src --component llvm-tools-preview
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: bash scripts/check.sh nightly
      - run: bash scripts/check.sh branches

  sanitizer:
    name: Sanitizer (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [address, thread]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned nightly
        run: |
          source scripts/tool-versions.sh
          rustup toolchain install "$PANCAKE_NIGHTLY" --profile minimal --component rust-src
      - run: bash scripts/check.sh sanitizer "${{ matrix.kind }}"

  required:
    name: Pancake required
    if: always()
    needs: [platform, assurance, nightly, sanitizer]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" != "success,success,success,success" ]]; then
            printf 'Pancake gates failed or were skipped: %s\n' "$RESULTS" >&2
            exit 1
          fi
