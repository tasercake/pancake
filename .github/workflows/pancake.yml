name: Pancake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

  workflow_call:
    inputs:
      candidate_sha:
        description: Release candidate commit produced by the package workflow
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pancake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: pancake

jobs:
  required:
    name: Pancake required
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        if: inputs.candidate_sha != ''
        with:
          sha: ${{ inputs.candidate_sha }}
      - name: Identify headless build inputs
        id: build-inputs
        run: |
          rustc_info=$(rustc -vV)
          host=$(printf '%s\n' "${ImageOS:?}" "${ImageVersion:?}" "$GITHUB_WORKSPACE" \
            "${CARGO_HOME:-$HOME/.cargo}" "$rustc_info" | git hash-object --stdin)
          printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
          python3 -B scripts/release_cache.py keys --checks "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Restore compiled headless checks
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pancake/target/debug
            ~/.cargo/registry
            ~/.cache/tracel
            ~/.local/share/tracel
          key: pancake-checks-v1-${{ steps.build-inputs.outputs.host }}-${{ steps.build-inputs.outputs.graph }}-${{ steps.build-inputs.outputs.inputs }}
          restore-keys: pancake-checks-v1-${{ steps.build-inputs.outputs.host }}-${{ steps.build-inputs.outputs.graph }}-
      - name: Reuse unchanged Cargo inputs
        if: steps.build-cache.outputs.cache-matched-key != ''
        env:
          EXACT: ${{ steps.build-cache.outputs.cache-hit }}
        run: |
          args=()
          if [[ "$EXACT" == true ]]; then
            args+=(--exact)
          else
            cargo clean --offline --locked --profile dev --workspace
          fi
          python3 -B scripts/release_cache.py restore-mtimes --checks "${args[@]}"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest@0.9.152,shellcheck@0.11.0
      - name: Install checksum-pinned actionlint release
        run: bash scripts/install-actionlint.sh "$RUNNER_TEMP/pancake-lint-tools"
      - run: bash scripts/check.sh lint
      - run: bash scripts/check.sh test
      - name: Save compiled headless checks
        if: (github.event_name == 'push' || inputs.candidate_sha != '') && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pancake/target/debug
            ~/.cargo/registry
            ~/.cache/tracel
            ~/.local/share/tracel
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
