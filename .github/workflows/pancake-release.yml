name: Pancake packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages to GitHub Releases
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a prerelease when publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pancake-packages
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: pancake

jobs:
  version:
    name: Check source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Cargo release version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Publish from the default branch.\n' >&2
            exit 1
          fi
          version=$(python3 -B scripts/release_support.py version)
          if [[ "$PUBLISH" == true ]]; then
            existing=$(git ls-remote origin "refs/tags/v$version")
            if [[ -n "$existing" ]]; then
              printf 'Tag v%s already exists. Set a new version before publishing.\n' "$version" >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package and smoke-test (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-amd64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, jobs: 4}
          - {platform: macos-arm64, os: macos-15, target: aarch64-apple-darwin, jobs: 3}
          - {platform: windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc, jobs: 4}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RUST_TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Prepare the platform toolchain
        id: toolchain
        run: |
          cargo --version
          target="$RUNNER_TEMP/pancake-target"
          dist="$RUNNER_TEMP/pancake-dist"
          mkdir -p "$dist"
          case "$RUNNER_OS" in
            Linux) llvm_data="${XDG_DATA_HOME:-$HOME/.local/share}/tracel" ;;
            macOS) llvm_data="$HOME/Library/Application Support/tracel" ;;
            Windows) llvm_data="$(cygpath -m "$LOCALAPPDATA")/tracel" ;;
          esac
          printf 'CARGO_TARGET_DIR=%s\nDIST=%s\nTRACEL_LLVM_DATA=%s\n' \
            "$target" "$dist" "$llvm_data" >> "$GITHUB_ENV"
          # Cargo build scripts can record absolute native paths and use the runner's SDK.
          identity=$(printf '%s\n' "${ImageOS:?}" "${ImageVersion:?}" "$GITHUB_WORKSPACE" \
            "$target" "$llvm_data" | git hash-object --stdin)
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      - name: Restore compiled release dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cache/tracel
            ${{ env.TRACEL_LLVM_DATA }}
          # Linux provenance expects a single CubeCL build variant. Restore only exact matches.
          key: >-
            pancake-release-${{ matrix.target }}-${{ steps.toolchain.outputs.identity }}-${{
              hashFiles('pancake/Cargo.lock', 'pancake/Cargo.toml', 'pancake/crates/*/Cargo.toml',
                        'pancake/.cargo/config.toml', 'pancake/rust-toolchain.toml', 'pancake/vendor/**',
                        'pancake/notices/llvm/manifest.json', 'pancake/scripts/ci-linux-native-deps.sh',
                        'pancake/scripts/package_macos.py', 'pancake/scripts/macos-release-linker.sh',
                        '.github/workflows/pancake-release.yml')
            }}

      - name: Reuse unchanged vendored dependencies
        if: steps.dependencies.outputs.cache-hit == 'true'
        # Cargo checks path dependencies by mtime. The exact key includes their content.
        run: find vendor -type f -exec touch -t 200001010000 {} +

      - name: Fetch the locked package graph
        if: steps.dependencies.outputs.cache-hit != 'true'
        # Notice collection resolves the locked graph offline.
        run: cargo fetch --locked --target "$RUST_TARGET"

      - name: Build and verify the Ubuntu Debian package
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-linux-native-deps.sh
          sudo apt-get install --yes --no-install-recommends dpkg-dev binutils
          cargo build --locked --release --workspace --bins
          release="$CARGO_TARGET_DIR/release"
          llvm_build="$release/build/cubecl-llvm"
          shopt -s nullglob
          link_outputs=("$llvm_build"/*/run/stdout)
          rlibs=("$llvm_build"/*/out/libcubecl_llvm-*.rlib)
          if [[ ${#link_outputs[@]} != 1 || ${#rlibs[@]} != 1 ]]; then
            printf 'Expected one CubeCL LLVM link output and one rlib.\n' >&2
            exit 1
          fi
          llvm_version=$(python -c 'import json; print(json.load(open("notices/llvm/manifest.json"))["wrapper_version"])')
          archive="$HOME/.cache/tracel/tracel-llvm-${llvm_version}-linux-x64"
          installed="${XDG_DATA_HOME:-$HOME/.local/share}/tracel/tracel-llvm-$llvm_version"
          python -B scripts/package_native_llvm.py --source "$PWD" --release "$release" \
            --build-output "${link_outputs[0]}" --rlib "${rlibs[0]}" \
            --archive "$archive.tar.xz" --sidecar "$archive.checksums.json" \
            --installed "$installed" > "$RUNNER_TEMP/native-llvm.json"
          python -B scripts/package_linux.py --release-dir "$release" --output "$RUNNER_TEMP/deb" \
            --maintainer 'Pancake Stacker <13855549+tasercake@users.noreply.github.com>' \
            --native-llvm-receipt "$RUNNER_TEMP/native-llvm.json"
          package="$RUNNER_TEMP/deb/pancake_${RELEASE_VERSION}_amd64.deb"
          sudo apt-get install --yes "$package"
          python -B scripts/release_support.py smoke /usr/bin/pancake-cli
          cp "$package" "$DIST/"
          cp "$RUNNER_TEMP/deb/package-receipt.json" "$DIST/pancake-linux-amd64-receipt.json"

      - name: Build the pinned static Zstandard library
        if: runner.os == 'macOS'
        run: |
          version=1.5.7
          tarball="zstd-$version.tar.gz"
          source_url="https://github.com/meta/zstd/releases/download/v$version/$tarball"
          digest=eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3
          curl --fail --silent --show-error --location "$source_url" --output "$RUNNER_TEMP/$tarball"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$tarball" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          zstd="$RUNNER_TEMP/zstd-$version"
          make -C "$zstd/lib" -j "$CARGO_BUILD_JOBS" libzstd.a
          printf 'PANCAKE_ZSTD_ARCHIVE=%s/lib/libzstd.a\nPANCAKE_ZSTD_SOURCE=%s\n' "$zstd" "$zstd" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=%s/scripts/macos-release-linker.sh\n' "$PWD" >> "$GITHUB_ENV"
          printf 'Source: %s\nSource SHA-256: %s\n' "$source_url" "$digest" > "$RUNNER_TEMP/zstd-source.txt"

      - name: Build and verify the Apple Silicon disk image
        if: runner.os == 'macOS'
        run: |
          payload="$RUNNER_TEMP/macos"
          python -B scripts/package_macos.py --output "$payload" \
            --target-dir "$CARGO_TARGET_DIR" \
            --bundle-identifier com.github.tasercake.pancake --build-number "$GITHUB_RUN_NUMBER"
          python -B scripts/release_support.py notices "$payload" "$RUST_TARGET" --features cubecl/metal-native
          mkdir "$payload/native-zstd"
          cp "$PANCAKE_ZSTD_SOURCE/LICENSE" "$RUNNER_TEMP/zstd-source.txt" "$payload/native-zstd/"
          mv "$payload/build.log" "$DIST/pancake-macos-arm64-build.log"
          mv "$payload/package-receipt.json" "$DIST/pancake-macos-arm64-receipt.json"
          package="$DIST/pancake-$RELEASE_VERSION-macos-arm64.dmg"
          ln -s /Applications "$payload/Applications"
          hdiutil create -srcfolder "$payload" -volname "Pancake Stacker" -fs HFS+ -format UDZO "$package"
          hdiutil verify "$package"
          mounted=$(mktemp -d "$RUNNER_TEMP/pancake-dmg.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mounted" "$package"
          trap 'hdiutil detach "$mounted"' EXIT
          test "$(readlink "$mounted/Applications")" = /Applications
          codesign --verify --strict "$mounted/Pancake.app"
          test -x "$mounted/Pancake.app/Contents/MacOS/pancake-gui"
          cmp "$payload/LICENSE" "$mounted/LICENSE"
          diff -qr "$payload/dependency-notices" "$mounted/dependency-notices"
          diff -qr "$payload/native-llvm" "$mounted/native-llvm"
          diff -qr "$payload/native-zstd" "$mounted/native-zstd"
          python -B scripts/release_support.py smoke "$mounted/pancake-cli"

      - name: Build and verify the Windows executables
        if: runner.os == 'Windows'
        run: |
          cargo build --locked --release --workspace --bins --target "$RUST_TARGET"
          payload="$RUNNER_TEMP/windows"
          python -B scripts/release_support.py notices "$payload" "$RUST_TARGET"
          python -B scripts/release_support.py windows-assets \
            "$CARGO_TARGET_DIR/$RUST_TARGET/release" "$payload" "$DIST" "$RELEASE_VERSION"
          python -B scripts/release_support.py smoke "$DIST/pancake-cli-$RELEASE_VERSION-windows-x64.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pancake-${{ matrix.platform }}
          path: ${{ runner.temp }}/pancake-dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Remove workspace outputs before caching
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.dependencies.outputs.cache-hit != 'true'
        run: |
          target=()
          if [[ "$RUNNER_OS" != Linux ]]; then target=(--target "$RUST_TARGET"); fi
          cargo clean --locked --release "${target[@]}" --workspace
      - name: Save compiled release dependencies
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cache/tracel
            ${{ env.TRACEL_LLVM_DATA }}
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

  publish:
    name: Publish to GitHub Releases
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pancake-*
          merge-multiple: true
          path: ${{ runner.temp }}/pancake-dist
      - name: Publish the tag and verified release assets
        working-directory: ${{ runner.temp }}/pancake-dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="v$RELEASE_VERSION"
          packages=(
            "pancake_${RELEASE_VERSION}_amd64.deb"
            "pancake-$RELEASE_VERSION-macos-arm64.dmg"
            "pancake-gui-$RELEASE_VERSION-windows-x64.exe"
            "pancake-cli-$RELEASE_VERSION-windows-x64.exe"
            "pancake-notices-$RELEASE_VERSION-windows-x64.tar.gz"
          )
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          notes="$RUNNER_TEMP/pancake-release-notes.md"
          cat > "$notes" <<NOTES
          - **macOS Apple Silicon** — Open the DMG, drag Pancake.app into Applications, then open the app. The app is ad-hoc signed and has no Apple notarization. The disk image also contains pancake-cli.
          - **Ubuntu 24.04 x86-64** — Install the DEB with \`sudo apt install ./${packages[0]}\`.
          - **Windows x64** — Download and run the pancake-gui executable. The pancake-cli executable and the license notices are separate downloads. Both executables are unsigned.

          Use SHA256SUMS.txt to verify the downloads.

          [Installation and first-launch help](https://github.com/$GH_REPO/blob/$GITHUB_SHA/pancake/docs/install.md) · [Stack your first photos](https://github.com/$GH_REPO/blob/$GITHUB_SHA/pancake/docs/desktop.md)

          [Source and build instructions](https://github.com/$GH_REPO/tree/$GITHUB_SHA#build-from-source).
          NOTES
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$tag" "${packages[@]}" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Pancake Stacker $tag" --notes-file "$notes" "${flags[@]}"
