name: Pancake Stacker packages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build packages for review or publish a release
        type: choice
        default: build-only
        options:
          - build-only
          - prerelease
          - stable
      cold_build:
        description: Bypass the package caches and retain Cargo timings in build-only mode
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pancake-packages-${{ inputs.mode == 'build-only' && github.ref || 'publish' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: pancake

jobs:
  prepare:
    name: Plan the release and prepare its source
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      ready: ${{ steps.history.outputs.ready }}
      version: ${{ steps.candidate.outputs.version }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Require the default branch for publishing
        env:
          MODE: ${{ inputs.mode }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$MODE" != build-only && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Select the default branch to publish a release.\n' >&2
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the changelog baseline and collect Git history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
        run: |
          channel=prerelease
          if [[ "$MODE" == stable ]]; then channel=stable; fi
          args=()
          if [[ "$MODE" == build-only ]]; then args+=(--build-only); fi
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
            jq 'add' > "$RUNNER_TEMP/pancake-releases.json"
          python3 -B scripts/release_plan.py inspect "$RUNNER_TEMP/pancake-plan" "$GITHUB_SHA" "$channel" \
            "$RUNNER_TEMP/pancake-releases.json" "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Ask Copilot for release highlights and a version bump
        if: >-
          steps.history.outputs.ready == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          install_dir="$RUNNER_TEMP/pancake-copilot"
          if ! timeout 120s npm install --prefix "$install_dir" --ignore-scripts --no-save @github/copilot@1.0.116; then
            printf '::warning::Copilot CLI installation failed. Using the Git changelog.\n'
            exit 0
          fi
          plan="$RUNNER_TEMP/pancake-plan"
          mkdir -p "$RUNNER_TEMP/pancake-copilot-session"
          cd "$RUNNER_TEMP/pancake-copilot-session"
          # The agent receives only the bounded Git digest and has no editing or publishing tools.
          if GITHUB_TOKEN="$COPILOT_TOKEN" COPILOT_HOME="$PWD" timeout 180s "$install_dir/node_modules/.bin/copilot" \
              --silent --model auto --max-ai-credits 30 --no-ask-user --no-custom-instructions \
              --disable-builtin-mcps --disable-mcp-server computer-use --available-tools=view \
              --deny-tool=read,view --disallow-temp-dir --sync-session=off \
              --prompt "$(cat "$plan/prompt.txt")" > "$plan/advice.tmp" &&
              [[ -s "$plan/advice.tmp" ]]; then
            mv "$plan/advice.tmp" "$plan/advice.json"
          else
            printf '::warning::Copilot was unavailable. Using the Git changelog.\n'
          fi
        env:
          COPILOT_AUTO_UPDATE: "false"
          COPILOT_TOKEN: ${{ github.token }}
      - name: Commit the selected version and record the changelog
        id: candidate
        if: steps.history.outputs.ready == 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          plan="$RUNNER_TEMP/pancake-plan"
          output="$RUNNER_TEMP/pancake-release-candidate"
          mkdir -p "$output"
          python3 -B scripts/release_plan.py prepare "$plan" "$GH_REPO" > "$plan/prepared.txt"
          version=$(python3 -B scripts/release_support.py version)
          git add -- Cargo.toml Cargo.lock assurance-platforms.json \
            crates/pancake-cli/Cargo.toml crates/pancake-gui/Cargo.toml
          timestamp=$(git show -s --format=%cI "$GITHUB_SHA")
          GIT_AUTHOR_DATE="$timestamp" GIT_COMMITTER_DATE="$timestamp" \
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Release Pancake v$version"
          git bundle create "$output/source.bundle" HEAD "^$GITHUB_SHA"
          cp "$plan/changelog.md" "$output/changelog.md"
          printf 'version=%s\nsha=%s\n' "$version" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            printf 'Candidate **v%s** at commit %s\n\n' "$version" "$(git rev-parse HEAD)"
            cat "$plan/prepared.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report that there are no new changes
        if: steps.history.outputs.ready == 'false'
        run: printf 'This source commit is already published for the selected channel.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.history.outputs.ready == 'true'
        with:
          name: release-candidate
          path: ${{ runner.temp }}/pancake-release-candidate
          if-no-files-found: error

  required:
    name: Check the release candidate
    if: needs.prepare.outputs.ready == 'true'
    needs: prepare
    uses: ./.github/workflows/pancake.yml
    with:
      candidate_sha: ${{ needs.prepare.outputs.sha }}

  assurance:
    name: Run stable release assurance
    if: inputs.mode == 'stable' && needs.prepare.outputs.ready == 'true'
    needs: prepare
    uses: ./.github/workflows/pancake-assurance.yml
    with:
      gate: release
      candidate_sha: ${{ needs.prepare.outputs.sha }}

  package:
    name: Package and smoke-test (${{ matrix.platform }})
    if: needs.prepare.outputs.ready == 'true'
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-amd64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, jobs: 4}
          - {platform: macos-arm64, os: macos-15, target: aarch64-apple-darwin, jobs: 3}
          - {platform: windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc, jobs: 4}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RUST_TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_INCREMENTAL: "0"
      COLD_BUILD: ${{ inputs.mode == 'build-only' && inputs.cold_build }}
      CARGO_TIMINGS: ${{ inputs.mode == 'build-only' && inputs.cold_build && '--timings' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        with:
          sha: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Ubuntu packaging and native build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-native-deps.sh dpkg-dev binutils

      - name: Prepare the platform toolchain
        id: toolchain
        run: |
          target="$RUNNER_TEMP/pancake-target"
          dist="$RUNNER_TEMP/pancake-dist"
          mkdir -p "$dist"
          case "$RUNNER_OS" in
            Linux)
              llvm_data="${XDG_DATA_HOME:-$HOME/.local/share}/tracel"
              native_tools=$(cc --version && ld --version && dpkg-query -W \
                libc6 libc6-dev libssl-dev libgtk-3-dev libfontconfig1-dev libxkbcommon-dev \
                libxcb-shape0-dev libxcb-xfixes0-dev)
              ;;
            macOS)
              llvm_data="$HOME/Library/Application Support/tracel"
              native_tools=$(xcode-select --print-path && xcodebuild -version -sdk macosx &&
                xcrun clang --version && sw_vers)
              ;;
            Windows)
              llvm_data="$(cygpath -m "$LOCALAPPDATA")/tracel"
              native_tools="${ImageVersion:?}"
              ;;
          esac
          printf 'CARGO_TARGET_DIR=%s\nDIST=%s\nTRACEL_LLVM_DATA=%s\n' \
            "$target" "$dist" "$llvm_data" >> "$GITHUB_ENV"
          # Cargo build scripts can record absolute native paths and use the runner's SDK.
          rustc_info=$(rustc -vV)
          identity=$(printf '%s\n' "${ImageOS:?}" "$GITHUB_WORKSPACE" "$target" "$llvm_data" \
            "${CARGO_HOME:-$HOME/.cargo}" "$rustc_info" "$native_tools" \
            "${SDKROOT:-}" "${MACOSX_DEPLOYMENT_TARGET:-}" | git hash-object --stdin)
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      - name: Identify the dependency graph and candidate build inputs
        id: build-inputs
        run: python -B scripts/release_cache.py keys "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore compiled release outputs
        if: env.COLD_BUILD != 'true'
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cache/tracel
            ${{ env.TRACEL_LLVM_DATA }}
            ${{ runner.temp }}/pancake-zstd
          # Bump v2 when changing the release build configuration in this workflow.
          key: pancake-release-v2-${{ matrix.target }}-${{ steps.toolchain.outputs.identity }}-${{ steps.build-inputs.outputs.graph }}-${{ steps.build-inputs.outputs.inputs }}
          # The same graph preserves a single CubeCL build variant for Linux provenance.
          restore-keys: pancake-release-v2-${{ matrix.target }}-${{ steps.toolchain.outputs.identity }}-${{ steps.build-inputs.outputs.graph }}-

      - name: Reuse unchanged Cargo inputs
        if: steps.build-cache.outputs.cache-matched-key != ''
        env:
          EXACT: ${{ steps.build-cache.outputs.cache-hit }}
        run: |
          args=(--llvm-data "$TRACEL_LLVM_DATA")
          if [[ "$EXACT" == true ]]; then
            args+=(--exact)
          else
            target=()
            if [[ "$RUNNER_OS" != Linux ]]; then target=(--target "$RUST_TARGET"); fi
            cargo clean --offline --locked --release --workspace "${target[@]}"
          fi
          python -B scripts/release_cache.py restore-mtimes "${args[@]}"

      - name: Fetch the locked package graph
        if: steps.build-cache.outputs.cache-matched-key == ''
        # Notice collection resolves the locked graph offline.
        run: cargo fetch --locked --target "$RUST_TARGET"

      - name: Build and verify the Ubuntu Debian package
        if: runner.os == 'Linux'
        run: |
          time -p cargo build --locked --release --workspace --bins ${{ env.CARGO_TIMINGS }}
          release="$CARGO_TARGET_DIR/release"
          llvm_build="$release/build/cubecl-llvm"
          shopt -s nullglob
          link_outputs=("$llvm_build"/*/run/stdout)
          rlibs=("$llvm_build"/*/out/libcubecl_llvm-*.rlib)
          if [[ ${#link_outputs[@]} != 1 || ${#rlibs[@]} != 1 ]]; then
            printf 'Expected one CubeCL LLVM link output and one rlib.\n' >&2
            exit 1
          fi
          llvm_version=$(python -c 'import json; print(json.load(open("notices/llvm/manifest.json"))["wrapper_version"])')
          archive="$HOME/.cache/tracel/tracel-llvm-${llvm_version}-linux-x64"
          installed="${XDG_DATA_HOME:-$HOME/.local/share}/tracel/tracel-llvm-$llvm_version"
          python -B scripts/package_native_llvm.py --source "$PWD" --release "$release" \
            --build-output "${link_outputs[0]}" --rlib "${rlibs[0]}" \
            --archive "$archive.tar.xz" --sidecar "$archive.checksums.json" \
            --installed "$installed" > "$RUNNER_TEMP/native-llvm.json"
          python -B scripts/package_linux.py --release-dir "$release" --output "$RUNNER_TEMP/deb" \
            --maintainer 'Pancake Stacker <13855549+tasercake@users.noreply.github.com>' \
            --native-llvm-receipt "$RUNNER_TEMP/native-llvm.json"
          package="$RUNNER_TEMP/deb/pancake_${RELEASE_VERSION}_amd64.deb"
          sudo apt-get install --yes "$package"
          python -B scripts/release_support.py smoke /usr/bin/pancake-cli
          cp "$package" "$DIST/"
          cp "$RUNNER_TEMP/deb/package-receipt.json" "$DIST/pancake-linux-amd64-receipt.json"

      - name: Build the pinned static Zstandard library
        if: runner.os == 'macOS'
        run: |
          version=1.5.7
          tarball="zstd-$version.tar.gz"
          source_url="https://github.com/meta/zstd/releases/download/v$version/$tarball"
          digest=eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3
          native="$RUNNER_TEMP/pancake-zstd"
          if [[ ! -s "$native/libzstd.a" || ! -s "$native/LICENSE" ]]; then
            curl --fail --silent --show-error --location "$source_url" --output "$RUNNER_TEMP/$tarball"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$tarball" | shasum -a 256 --check
            tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
            zstd="$RUNNER_TEMP/zstd-$version"
            make -C "$zstd/lib" -j "$CARGO_BUILD_JOBS" libzstd.a
            mkdir -p "$native"
            cp "$zstd/lib/libzstd.a" "$zstd/LICENSE" "$native/"
          fi
          printf 'PANCAKE_ZSTD_ARCHIVE=%s/libzstd.a\n' "$native" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=%s/scripts/macos-release-linker.sh\n' "$PWD" >> "$GITHUB_ENV"
          printf 'Source: %s\nSource SHA-256: %s\n' "$source_url" "$digest" > "$RUNNER_TEMP/zstd-source.txt"

      - name: Build and verify the Apple Silicon disk image
        if: runner.os == 'macOS'
        run: |
          payload="$RUNNER_TEMP/macos"
          notices="$RUNNER_TEMP/pancake-macos-notices"
          python -B scripts/release_support.py notices "$notices" "$RUST_TARGET" --features cubecl/metal-native
          mkdir "$notices/native-zstd"
          cp "$RUNNER_TEMP/pancake-zstd/LICENSE" "$RUNNER_TEMP/zstd-source.txt" "$notices/native-zstd/"
          time -p python -B scripts/package_macos.py --output "$payload" \
            --target-dir "$CARGO_TARGET_DIR" --release-notices "$notices" \
            --bundle-identifier com.github.tasercake.pancake --build-number "$GITHUB_RUN_NUMBER" ${{ env.CARGO_TIMINGS }}
          mv "$payload/build.log" "$DIST/pancake-macos-arm64-build.log"
          mv "$payload/package-receipt.json" "$DIST/pancake-macos-arm64-receipt.json"

          python -m pip install --require-hashes --only-binary=:all: -r scripts/macos-dmg-requirements.txt
          installer_assets="$PWD/scripts/macos-dmg"
          package="$DIST/pancake-$RELEASE_VERSION-macos-arm64.dmg"
          app_name="Pancake Stacker.app"
          python -B -m dmgbuild -s scripts/macos-dmg-settings.py -D "app=$payload/$app_name" \
            -D "assets=$installer_assets" "Pancake Stacker" "$package"
          hdiutil verify "$package"

          mounted=$(mktemp -d "$RUNNER_TEMP/pancake-dmg.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mounted" "$package"
          trap 'hdiutil detach "$mounted"' EXIT
          visible=("$mounted"/*)
          test "${#visible[@]}" -eq 3
          test "$(readlink "$mounted/Applications")" = /Applications
          test -s "$mounted/.background.tiff"
          cmp "$installer_assets/First Launch Help.html" "$mounted/First Launch Help.html"
          python -B - "$mounted/.DS_Store" "$app_name" <<'PY'
          import sys
          from ds_store import DSStore

          with DSStore.open(sys.argv[1], "r") as layout:
              left, right = layout[sys.argv[2]]["Iloc"], layout["Applications"]["Iloc"]
              if left[0] >= right[0] or left[1] != right[1]:
                  raise SystemExit("Expected the app to the left of Applications in Finder")
              help_position = layout["First Launch Help.html"]["Iloc"]
              if help_position[1] <= left[1] or not layout["."]["icvp"].get("backgroundImageAlias"):
                  raise SystemExit("Expected the first-launch guide below the install icons")
          PY

          installed="$RUNNER_TEMP/pancake-install/$app_name"
          ditto "$mounted/$app_name" "$installed"
          codesign --verify --strict --deep "$installed"
          test -x "$installed/Contents/MacOS/pancake-gui"
          diff -qr "$payload/$app_name" "$installed"
          diff -qr "$notices" "$installed/Contents/Resources/Notices"
          python -B scripts/release_support.py smoke "$installed/Contents/MacOS/pancake-cli"

      - name: Build and verify the Windows executables
        if: runner.os == 'Windows'
        run: |
          time -p cargo build --locked --release --workspace --bins ${{ env.CARGO_TIMINGS }} --target "$RUST_TARGET"
          payload="$RUNNER_TEMP/windows"
          python -B scripts/release_support.py notices "$payload" "$RUST_TARGET"
          python -B scripts/release_support.py windows-assets \
            "$CARGO_TARGET_DIR/$RUST_TARGET/release" "$payload" "$DIST" "$RELEASE_VERSION"
          python -B scripts/release_support.py smoke "$DIST/pancake-cli-$RELEASE_VERSION-windows-x64.exe"

      - name: Upload Cargo timings
        if: env.COLD_BUILD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-${{ matrix.platform }}
          path: ${{ env.CARGO_TARGET_DIR }}/cargo-timings/cargo-timing.html
          if-no-files-found: error

      - name: Save compiled release outputs
        if: env.COLD_BUILD != 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cache/tracel
            ${{ env.TRACEL_LLVM_DATA }}
            ${{ runner.temp }}/pancake-zstd
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Verify the Windows Explorer branding
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $env:DIST "pancake-gui-${env:RELEASE_VERSION}-windows-x64.exe"
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($app)
          if ($info.FileVersion -cne $env:RELEASE_VERSION -or $info.ProductVersion -cne $env:RELEASE_VERSION) {
            throw "Expected Windows version ${env:RELEASE_VERSION}, got FileVersion '$($info.FileVersion)' and ProductVersion '$($info.ProductVersion)'"
          }
          if ($info.ProductName -cne "Pancake Stacker" -or $info.FileDescription -cne "Pancake Stacker") {
            throw "Unexpected Windows ProductName '$($info.ProductName)' and FileDescription '$($info.FileDescription)'"
          }
          Add-Type -Name ShellIcons -Namespace Pancake -MemberDefinition @'
          [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
          public static extern uint ExtractIconEx(string file, int index, IntPtr large, IntPtr small, uint count);
          '@
          if ([Pancake.ShellIcons]::ExtractIconEx($app, -1, [IntPtr]::Zero, [IntPtr]::Zero, 0) -ne 1) {
            throw "The Windows executable must contain one application icon group"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pancake-${{ matrix.platform }}
          path: ${{ runner.temp }}/pancake-dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish to GitHub Releases
    if: >-
      always() && !cancelled() && inputs.mode != 'build-only' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.prepare.result == 'success' && needs.prepare.outputs.ready == 'true' &&
      needs.package.result == 'success' && needs.required.result == 'success' &&
      (inputs.mode != 'stable' || needs.assurance.result == 'success')
    needs: [prepare, package, required, assurance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/checkout-release-candidate
        with:
          sha: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pancake-*
          merge-multiple: true
          path: ${{ runner.temp }}/pancake-dist
      - name: Stage and publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
        run: |
          flags=()
          if [[ "$MODE" == prerelease ]]; then flags+=(--prerelease); fi
          url=$(python3 -B scripts/release_publish.py "$RUNNER_TEMP/pancake-dist" \
            "$RUNNER_TEMP/pancake-release-candidate" "${flags[@]}")
          printf '[Published Pancake Stacker release](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
