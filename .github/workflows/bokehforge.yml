name: BokehForge

on:
  pull_request:
    paths:
      - bokehforge/**
      - .github/workflows/bokehforge.yml

permissions:
  contents: read

concurrency:
  group: bokehforge-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: bokehforge

jobs:
  scoring:
    name: BokehForge scoring parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.13.10"
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build source distribution and wheel
        run: python -m uv build
      - name: Install the wheel with locked dependencies
        run: |
          python -m uv sync --frozen --no-install-project ${{ runner.os == 'macOS' && '--extra inspection' || '' }}
          python -m uv pip install --python .venv --no-deps dist/*.whl
      - name: Verify the installed Rust extension and resources
        run: |
          python -m uv run --no-sync python - <<'PY'
          from importlib.resources import files

          from bokehforge import _rust

          print(_rust.__file__)
          assert callable(_rust.sample_linear)
          assert callable(_rust.lightness_damage)
          assert callable(_rust.pool_tiles)
          assert callable(_rust.PreviewEncoder)
          assert files("bokehforge").joinpath("heatmaps.html").is_file()
          assert files("bokehforge.data").joinpath("sources.json").is_file()
          assert files("bokehforge.review").joinpath("static", "index.html").is_file()
          assert files("bokehforge.review").joinpath("static", "fonts", "SpaceGrotesk-Regular.ttf").is_file()
          PY
      - name: Report Apple Metal capability
        if: runner.os == 'macOS'
        run: |
          python -m uv run --no-sync python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import platform
          import torch

          mps = torch.backends.mps
          print(f"PyTorch {torch.__version__} on {platform.machine()}. MPS built={mps.is_built()}, available={mps.is_available()}.")
          PY
      - name: Run scoring and parity tests
        run: >
          python -m uv run --no-sync python -m pytest -ra
          tests/test_scoring.py tests/test_alignment.py tests/test_native_damage.py
          tests/test_native_pooling.py tests/test_inspection.py tests/test_bench.py
