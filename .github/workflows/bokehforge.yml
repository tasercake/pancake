name: BokehForge

on:
  pull_request:
    paths:
      - bokehforge/**
      - .github/workflows/bokehforge.yml

permissions:
  contents: read

concurrency:
  group: bokehforge-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: bokehforge

jobs:
  scoring:
    name: BokehForge scoring parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/bokehforge/target
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.13.10"
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build source distribution and wheel
        run: python -m uv build
      - name: Install the wheel with locked dependencies
        run: |
          python -m uv sync --frozen --no-install-project
          python -m uv pip install --python .venv --no-deps dist/*.whl
      - name: Verify the installed Rust extension and resources
        run: |
          python -m uv run --no-sync python - <<'PY'
          from importlib.metadata import distribution
          from importlib.resources import files
          from pathlib import Path
          import subprocess
          import sys

          from bokehforge import _rust
          from bokehforge._attention_setup import _runtime_library

          print(_rust.__file__)
          assert callable(_rust.sample_linear)
          assert callable(_rust.measure_delivery)
          assert callable(_rust.pool_tiles)
          assert callable(_rust.PreviewEncoder)
          assert _rust.damage_backend("cpu") == "cpu"
          runtime = _runtime_library()
          assert runtime is not None and runtime.is_file(), runtime
          if sys.platform == "darwin":
              wheel = next(Path("dist").glob("*.whl"))
              assert wheel.name.endswith("-macosx_15_0_arm64.whl"), wheel.name
          if sys.platform == "linux":
              libraries = subprocess.check_output(["ldd", _rust.__file__], text=True)
              for name in ("libLLVM", "libcuda.so", "libnvrtc", "libonnxruntime"):
                  assert name not in libraries, libraries
          license_files = {file.name for file in distribution("bokehforge").files
                           if file.parent.name == "llvm" and "licenses" in file.parts}
          assert {"LICENSE.TXT", "BLAKE3-LICENSE", "Support-NOTICE.TXT", "PROVENANCE.txt"} <= license_files
          assert files("bokehforge").joinpath("heatmaps.html").is_file()
          assert files("bokehforge.data").joinpath("sources.json").is_file()
          assert files("bokehforge.review").joinpath("static", "index.html").is_file()
          assert files("bokehforge.review").joinpath("static", "view-state.js").is_file()
          assert files("bokehforge.review").joinpath("static", "fonts", "SpaceGrotesk-Regular.ttf").is_file()
          PY
      - name: Run CPU scoring and parity tests
        run: >
          python -m uv run --no-sync python -m pytest -ra -m 'not hardware_accelerator'
          tests/test_scoring.py tests/test_alignment.py tests/test_native_damage.py
          tests/test_native_pooling.py tests/test_inspection.py tests/test_inspection_export.py tests/test_bench.py
          tests/test_native_runtime.py tests/test_delivery_io.py
