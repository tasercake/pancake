name: BokehForge

on:
  pull_request:
    paths:
      - bokehforge/**
      - .github/workflows/bokehforge.yml

permissions:
  contents: read

concurrency:
  group: bokehforge-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: bokehforge

jobs:
  scoring:
    name: BokehForge scoring parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.13.10"
      - name: Install BokehForge from the lockfile
        run: python -m uv sync --frozen --no-editable ${{ runner.os == 'macOS' && '--extra inspection' || '' }}
      - name: Require both native extensions
        run: >
          python -m uv run --no-sync python -c
          'from bokehforge import _alignment_native, _scoring_native; print(_alignment_native.__file__, _scoring_native.__file__)'
      - name: Report Apple Metal capability
        if: runner.os == 'macOS'
        run: |
          python -m uv run --no-sync python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import platform
          import torch

          mps = torch.backends.mps
          print(f"PyTorch {torch.__version__} on {platform.machine()}. MPS built={mps.is_built()}, available={mps.is_available()}.")
          PY
      - name: Run scoring and parity tests
        run: >
          python -m uv run --no-sync python -m pytest -ra
          tests/test_scoring.py tests/test_alignment.py tests/test_native_damage.py
          tests/test_native_pooling.py tests/test_inspection.py tests/test_bench.py
