name: Stackroom web

on:
  pull_request:
    paths:
      - bokehforge/web/**
      - bokehforge/src/bokehforge/review/static/view-state.js
      - .github/workflows/stackroom-web.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: bokehforge

jobs:
  stackroom-url:
    name: Stackroom URL state
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c581273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --prefix web
      - run: npm --prefix web run check
      - run: npm --prefix web test
