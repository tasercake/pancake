name: Check out the Pancake release candidate
description: Restore and verify the candidate commit built from the dispatched source
inputs:
  sha:
    description: Expected candidate commit
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-candidate
        path: ${{ runner.temp }}/pancake-release-candidate
    - name: Verify and check out the candidate
      shell: bash
      env:
        CANDIDATE_SHA: ${{ inputs.sha }}
      run: |
        git fetch --no-tags "$RUNNER_TEMP/pancake-release-candidate/source.bundle" HEAD
        test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
        test "$(git rev-parse 'FETCH_HEAD^')" = "$GITHUB_SHA"
        git checkout --quiet --detach "$CANDIDATE_SHA"
