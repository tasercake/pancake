<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BokehForge Review</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div><strong>BokehForge</strong><span>Focus stack review</span></div>
      </div>
      <div class="tools">
        <a class="button quiet" href="/api/ratings.csv" download>Export ratings</a>
        <button class="primary" id="open-run" type="button" disabled><span aria-hidden="true">+</span> New evaluation</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <p id="connection-status" class="inline-error" role="status" hidden></p>
    <section class="notice" id="catalog-state" aria-live="polite">
      <h1>Indexing local datasets</h1>
      <p id="catalog-note">Verifying the downloaded originals before opening the scene catalog.</p>
    </section>
    <section class="download-banner" id="download-banner" aria-labelledby="download-title" hidden>
      <div class="download-description">
        <h2 id="download-title">Datasets</h2>
        <p id="download-state" role="status"></p>
        <p class="inline-error" id="download-error" role="alert" hidden></p>
      </div>
      <div class="download-meter" id="download-meter" hidden>
        <progress id="download-progress" aria-label="Dataset download progress"></progress>
        <span id="download-detail"></span>
      </div>
      <button class="primary" id="download-start" type="button">Download datasets</button>
    </section>
    <div class="run-banner" id="run-banner" hidden>
      <div><strong id="run-status"></strong><span id="run-detail"></span></div>
      <progress id="run-progress" aria-label="Evaluation progress"></progress>
      <button class="quiet" id="stop-run" type="button">Stop run</button>
    </div>
    <div class="workspace" id="workspace" hidden>
      <aside class="scene-sidebar" aria-labelledby="scenes-title">
        <div class="sidebar-header">
          <div class="sidebar-title"><h2 id="scenes-title">Scenes</h2><span id="sidebar-count" class="muted"></span></div>
          <label class="control">Dataset<select id="dataset"><option value="">All datasets</option></select></label>
        </div>
        <div class="scene-list" id="scene-list" aria-label="Dataset scenes" tabindex="0">
          <div class="rail-track" role="list"></div>
        </div>
      </aside>
      <section class="workspace-body" aria-label="Scene review">
        <div class="scene-heading">
          <div class="scene-title">
            <p class="overline" id="scene-position"></p>
            <h1 id="scene-name" aria-live="polite"></h1>
            <p class="scene-meta" id="scene-meta"></p>
          </div>
          <div class="scene-controls">
            <div class="scene-navigation">
              <button id="previous" type="button" title="Previous scene (Up arrow)">Previous</button>
              <label class="visually-hidden" for="jump">Go to scene number</label>
              <input id="jump" type="number" min="1" inputmode="numeric">
              <button id="next" type="button" title="Next scene (Down arrow)">Next</button>
            </div>
          </div>
        </div>
        <p class="inline-error" id="scene-error" role="alert" hidden></p>
        <section class="review" aria-label="Focus stack comparison">
          <div class="review-heading">
            <h2>Compare images</h2>
            <label class="run-control" for="run-select">Evaluation<select id="run-select"><option value="">No evaluations yet</option></select></label>
          </div>
          <div class="output-tabs" id="output-tabs" aria-label="Stacker outputs"></div>
          <div class="comparison">
            <figure class="pane">
              <figcaption><span>Source frame</span><span class="pane-meta" id="source-meta"></span></figcaption>
              <div class="image-well" id="source-image"></div>
            </figure>
            <figure class="pane candidate">
              <figcaption><span>Stacker output</span><span class="pane-meta" id="candidate-meta"></span></figcaption>
              <div class="image-well" id="candidate-image"></div>
              <p class="candidate-benchmark" id="candidate-benchmark" role="status" hidden></p>
            </figure>
            <figure class="pane">
              <figcaption><span id="reference-title">Ground truth</span><span class="pane-meta" id="reference-meta"></span></figcaption>
              <div class="image-well" id="reference-image"></div>
              <label class="reference-select" id="reference-control" hidden>Reference image<select id="reference-select"></select></label>
            </figure>
          </div>
          <div class="film">
            <div class="film-heading">
              <div><h3>Source frames</h3><span id="film-range"></span></div>
            </div>
            <div class="filmstrip" id="filmstrip" aria-label="Source frame thumbnails" tabindex="0">
              <div class="rail-track" role="list"></div>
            </div>
          </div>
        </section>

        <section class="review ratings" aria-labelledby="rating-title">
          <div class="review-heading">
            <h2 id="rating-title">Rate outputs</h2>
            <span class="muted" id="rating-count"></span>
          </div>
          <form class="rating-form" id="rating-form" hidden>
            <fieldset>
              <legend>Grade <span class="muted">· 5 is best</span></legend>
              <div class="grade-options">
                <label><input required name="grade" type="radio" value="1"><span>1</span></label>
                <label><input name="grade" type="radio" value="2"><span>2</span></label>
                <label><input name="grade" type="radio" value="3"><span>3</span></label>
                <label><input name="grade" type="radio" value="4"><span>4</span></label>
                <label><input name="grade" type="radio" value="5"><span>5</span></label>
              </div>
            </fieldset>
            <label class="comment" for="comment">Comment <span class="muted">· optional</span>
              <textarea id="comment" rows="2" maxlength="4000" placeholder="Describe the details that influenced your grade"></textarea>
            </label>
            <div class="save-area">
              <button class="primary" id="save-rating" type="submit">Save rating</button>
              <span class="muted" id="rating-status" role="status"></span>
            </div>
          </form>
          <p class="rating-empty muted" id="rating-empty"></p>
        </section>
        <footer class="keyboard">Scenes <kbd>↑</kbd> <kbd>↓</kbd><span aria-hidden="true">·</span> Source frames <kbd>←</kbd> <kbd>→</kbd></footer>
      </section>
    </div>
  </main>

  <dialog id="new-run">
    <div class="dialog-heading"><h2>New evaluation</h2><button class="quiet" type="button" data-close="new-run">Close</button></div>
    <form id="run-form" novalidate>
      <div class="scope-field">
        <label class="control">Evaluate<select id="scope" aria-describedby="scope-summary"></select></label>
        <p id="scope-summary" class="muted"></p>
      </div>
      <fieldset class="stackers"><legend>Stacking programs</legend><div id="available-tools"></div></fieldset>
      <p class="inline-error" id="run-error" role="alert" hidden></p>
      <button class="primary" id="start-run" type="submit">Start evaluation</button>
    </form>
  </dialog>
  <dialog class="image-dialog" id="image-dialog" aria-labelledby="image-title">
    <div class="dialog-heading">
      <div class="lightbox-caption">
        <h2 id="image-title" aria-live="polite"></h2>
        <p class="lightbox-benchmark" id="lightbox-benchmark" role="status" hidden></p>
      </div>
      <div class="tools">
        <button class="quiet zoom-button" id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button class="quiet" id="image-fit" type="button" aria-label="Fit image">Fit</button>
        <button class="quiet zoom-button" id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button class="quiet" id="pixel-mode" type="button" aria-pressed="false">1:1 pixels</button>
        <button class="quiet" id="reference-swipe" type="button" aria-pressed="false" disabled>Swipe reference</button>
        <button class="quiet" data-close="image-dialog" type="button">Close</button>
      </div>
    </div>
    <div class="lightbox-body">
      <div class="image-view" id="image-view" role="region" aria-label="Image viewer" tabindex="0"></div>
      <div class="reference-divider" id="reference-divider" hidden>
        <button type="button" role="slider" id="reference-slider" aria-label="Reference reveal"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
          title="Drag to reveal the reference"></button>
      </div>
      <p id="lightbox-status" role="status"></p>
    </div>
    <div class="filmstrip lightbox-strip" id="lightbox-strip" role="list" aria-label="Scene images">
      <div class="rail-track" role="presentation"></div>
    </div>
  </dialog>
</body>
</html>
