[package]
name = "bokehforge-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
name = "_rust"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
cubecl = { version = "=0.11.4", default-features = false, features = ["std", "stdlib", "cpu"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
numpy = { version = "0.26", features = ["half"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "cuda", "coreml", "api-24"] }
pyo3 = "0.26"
rayon = "1"
realfft = "3"
rustfft = "6"
serde_json = "1"
sha2 = "0.10"
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw", "zstd"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cubecl = { version = "=0.11.4", default-features = false, features = ["cuda"] }
cudarc = { version = "=0.19.9", default-features = false, features = ["cuda-12000", "fallback-dynamic-loading", "driver"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.build-dependencies]
# CubeCL also reads the selected CUDA API version from cudarc at build time.
cudarc = { version = "=0.19.9", default-features = false, features = ["cuda-12000", "fallback-dynamic-loading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cubecl = { version = "=0.11.4", default-features = false, features = ["metal-native", "wgpu-msl"] }
objc2-metal = { version = "0.3", default-features = false, features = ["MTLDevice"] }
