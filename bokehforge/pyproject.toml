[project]
name = "bokehforge"
version = "0.1.0"
description = "A measurement-first workbench for sharp focus stacks."
readme = "README.md"
license-files = ["notices/llvm/*"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pillow>=11,<13",
  "tifffile>=2025.1.10",
  "imagecodecs>=2025.3.30",
  "rawpy>=0.24,<0.27",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "libarchive-c>=5.1,<6",
  "filelock>=3,<5",
  "wsproto>=1.2,<2",
  "onnx==1.18.0",
  "onnxruntime-gpu==1.24.4; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
  "onnxruntime==1.24.4; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'aarch64')",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.57.6",
  "timm==1.0.24",
  "pandas==2.3.3",
  "ftfy==6.3.1",
  "einops==0.8.2",
  "opencv-python-headless>=4.13,<5",
]

[project.scripts]
bokehforge = "bokehforge.cli:main"

[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
python-source = "src"
module-name = "bokehforge._rust"
locked = true
compatibility = "linux"
include = [
  { path = "Cargo.toml", format = "sdist" },
  { path = "Cargo.lock", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = ".cargo/config.toml", format = "sdist" },
  { path = "rust/**/*.rs", format = "sdist" },
]

[tool.maturin.target.aarch64-apple-darwin]
macos-deployment-target = "15.0"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "rust-toolchain.toml" },
  { file = ".cargo/config.toml" },
  { file = "rust/**/*.rs" },
  { file = "notices/llvm/*" },
  { file = "src/bokehforge/__init__.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"
markers = ["hardware_accelerator: exercises local CUDA, Metal, or Core ML hardware"]
