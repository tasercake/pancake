[project]
name = "bokehforge"
version = "0.1.0"
description = "A measurement-first workbench for sharp focus stacks."
readme = "README.md"
license-files = ["notices/llvm/*"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pillow>=11,<13",
  "tifffile>=2025.1.10",
  "imagecodecs>=2025.3.30",
  "rawpy>=0.24,<0.27",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "libarchive-c>=5.1,<6",
  "filelock>=3,<5",
]

[project.scripts]
bokehforge = "bokehforge.cli:main"

[project.optional-dependencies]
inspection = [
  "onnx==1.18.0",
  "onnxruntime-gpu==1.24.4; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
  "onnxruntime==1.24.4; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'aarch64')",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.57.6",
  "timm==1.0.24",
  "pandas==2.3.3",
  "ftfy==6.3.1",
  "einops==0.8.2",
  "opencv-python-headless>=4.13,<5",
]

[build-system]
requires = ["setuptools>=80", "setuptools-rust>=1.12,<2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
bokehforge = ["heatmaps.html"]
"bokehforge.data" = ["sources.json"]
"bokehforge.review" = ["static/*", "static/fonts/*"]

[[tool.setuptools-rust.ext-modules]]
target = "bokehforge._rust"
path = "Cargo.toml"
binding = "PyO3"
cargo-manifest-args = ["--locked"]
debug = false

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "MANIFEST.in" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "rust-toolchain.toml" },
  { file = ".cargo/config.toml" },
  { file = "rust/**/*.rs" },
  { file = "notices/llvm/*" },
  { file = "src/bokehforge/__init__.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
