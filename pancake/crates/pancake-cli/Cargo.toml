[package]
name = "pancake-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Command-line interface for Pancake focus stacking"
license = "GPL-3.0-or-later"
repository = "https://github.com/tasercake/focus-stacking"
readme = "../../README.md"
keywords = ["photography", "focus-stacking", "image-processing"]
categories = ["command-line-utilities", "multimedia::images"]
publish = false

[dependencies]
clap = { version = "=4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
pancake = { path = "../..", version = "=0.1.0" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
