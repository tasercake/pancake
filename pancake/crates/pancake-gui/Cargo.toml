[package]
name = "pancake-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
description = "Native Slint frontend for the Pancake focus-stacking application"
repository = "https://github.com/tasercake/focus-stacking"
keywords = ["photography", "focus-stacking", "image-processing"]
categories = ["multimedia::images"]
publish = false

[dependencies]
pancake = { version = "=0.1.0", path = "../.." }
num-traits = "=0.2.19"
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "unstable-wgpu-30", "compat-1-18", "accessibility", "raw-window-handle-06"] }
slint-interpreter = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "compat-1-18", "accessibility"] }
spin_on = "=0.1.1"
dirs = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.19.0", features = ["v3_24"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "=0.18.0", default-features = false }
